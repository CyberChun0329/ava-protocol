[profile.default]
src = "src/canonical"
test = "test"
out = ".build/out"
cache_path = ".build/cache"
libs = []
test_failures_file = ".build/test-failures"
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"

[fuzz]
runs = 128

[invariant]
runs = 64
depth = 64
fail_on_revert = true
show_metrics = true
